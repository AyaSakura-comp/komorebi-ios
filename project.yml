name: KomorebiVoice
options:
  bundleIdPrefix: dev.ayasakura
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

packages:
  KomorebiKit:
    path: .
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.1
  SwiftyOpenCC:
    url: https://github.com/ddddxxx/SwiftyOpenCC
    exactVersion: 1.0.1

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: MAHQU3A9TS
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  KomorebiVoice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - Dictionary
      - path: App/Dictionary
        type: folder
        buildPhase: resources
    entitlements:
      path: Komorebi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ayasakura.komorebi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ayasakura.komorebi
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: KomorebiKit
        product: KomorebiCore
      - package: KomorebiKit
        product: KomorebiIPC
      - package: sherpa-onnx
        product: sherpa-onnx
      - package: SwiftyOpenCC
        product: OpenCC
      - target: KomorebiKeyboard
        embed: true
    scheme:
      testTargets:
        - KomorebiAppTests
        - KomorebiUITests

  KomorebiKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KeyboardExtension
        excludes:
          - Info.plist
    entitlements:
      path: KeyboardExtension/KomorebiKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ayasakura.komorebi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ayasakura.komorebi.keyboard
        INFOPLIST_FILE: KeyboardExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: KomorebiKit
        product: KomorebiIPC

  KomorebiAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ayasakura.komorebi.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KomorebiVoice
      - package: KomorebiKit
        product: KomorebiCore
      - package: KomorebiKit
        product: KomorebiIPC

  KomorebiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ayasakura.komorebi.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KomorebiVoice
    dependencies:
      - target: KomorebiVoice
